# Nexus 模型预设：Anthropic Messages API。
# 推荐运行 nexus settings set-key anthropic 将密钥保存到受限权限的本地配置。
# ANTHROPIC_API_KEY 环境变量仍可作为备用方式。

[cli]
auto_update = false

[models]
default = "anthropic-coding"
max_completion_tokens = 8192
session_summary = "claude-sonnet-4-20250514"
image_description = "claude-sonnet-4-20250514"

[model.anthropic-coding]
# 请改成你的账号实际可用的模型标识。
model = "claude-sonnet-4-20250514"
base_url = "https://api.anthropic.com/v1"
name = "Anthropic 编码模型"
description = "使用你自己的 API Key 访问 Anthropic Messages API"
api_backend = "messages"
context_window = 200000
extra_headers = { "anthropic-version" = "2023-06-01" }

# 上游运行时会原样传递 Messages API 所需的请求头。
# 使用前设置：export ANTHROPIC_API_KEY="你的密钥"
env_key = "ANTHROPIC_API_KEY"

[sandbox]
profile = "workspace"

[ui]
default_selected_permission = "allow_once"
remember_tool_approvals = true

[features]
telemetry = false
remote_fetch = false
codebase_indexing = true

[telemetry]
trace_upload = false
